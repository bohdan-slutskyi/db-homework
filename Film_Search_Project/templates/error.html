{% extends "base.html" %}

{% block title %}{{ error_title }} | Film Search Project{% endblock %}

{% block content %}
    <section class="mx-auto max-w-2xl rounded-[28px] border border-amber-200/80 bg-amber-50/90 p-8 text-center shadow-soft dark:border-amber-300/20 dark:bg-slate-900/85">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-amber-100 text-2xl text-amber-700 dark:bg-amber-950/70 dark:text-amber-200">
            !
        </div>
        <h1 class="mt-5 text-3xl font-semibold tracking-tight text-ink dark:text-white">
            {{ error_title }}
        </h1>
        <p class="mt-3 text-base leading-7 text-stone-600 dark:text-purple-100/75">
            {{ error_message }}
        </p>
        <a
            href="{{ url_for('index') }}"
            class="mt-6 inline-flex items-center justify-center rounded-full border border-purple-600 bg-purple-600 px-5 py-2.5 text-sm font-medium text-white transition hover:-translate-y-0.5 dark:border-purple-300 dark:bg-purple-300 dark:text-slate-950"
        >
            Вернуться на главную
        </a>
    </section>
{% endblock %}
